[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

# Full-distribution hashing also runs during real-browser dev/test acceptance.
# Preserve all integrity checks while avoiding unoptimized SHA-256 compression.
[profile.dev.package.sha2]
opt-level = 3
