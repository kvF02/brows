[package]
name = "brows-adapters-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Verified Chromium process adapter for Brows"

[dependencies]
brows-application = { path = "../application" }
brows-contracts = { path = "../contracts" }
brows-domain = { path = "../domain" }
serde_json.workspace = true
sha2 = "0.10"
serde = { workspace = true }
getrandom = "0.3.4"
dunce = "1.0.5"
reqwest = { version = "0.13.4", default-features = false, features = ["native-tls"] }
tokio = { version = "1", features = ["rt", "time", "macros"] }
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }
