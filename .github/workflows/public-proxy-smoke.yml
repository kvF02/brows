name: Public proxy TLS regression
on:
  push:
    branches: [codex/public-proxy-smoke]
    paths: ['.github/workflows/public-proxy-smoke.yml']
permissions:
  contents: read
jobs:
  tls-recheck:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Check the previously reachable public SOCKS5 with verified HTTPS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Force target | Out-Null
          cargo build -p brows-adapters-proxy --example public_proxy_probe --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $output = & ./target/debug/examples/public_proxy_probe.exe socks5 184.178.172.17 4145
          $code = $LASTEXITCODE
          $text = [string] $output
          $rejectedUntrustedTls = $code -eq 1 -and $text -eq 'ERROR|ProxyConnect|proxy TLS certificate verification or handshake failed'
          @{
            productCommit = '305b1a2b60ffb1a7d8fe133495568f9f02b24be4'
            observedAt = [DateTimeOffset]::UtcNow.ToString('o')
            source = 'https://geonode.com/free-proxy-list/usa'
            proxy = 'socks5://184.178.172.17:4145'
            adapterExit = $code
            adapterResult = $text
            rejectedUntrustedTls = $rejectedUntrustedTls
            scope = 'Single anonymous fixed HTTPS IP request via production adapter. No user credentials, direct fallback or certificate-validation bypass.'
          } | ConvertTo-Json | Tee-Object target/public-proxy-tls-regression.json
          if (-not $rejectedUntrustedTls) { throw 'Public endpoint changed or could not reproduce TLS rejection; inspect the evidence' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-proxy-tls-regression
          path: target/public-proxy-tls-regression.json
          if-no-files-found: warn
