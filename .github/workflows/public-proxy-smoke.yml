name: Public proxy smoke diagnostics
on:
  push:
    branches: [codex/public-proxy-smoke]
    paths:
      - '.github/workflows/public-proxy-smoke.yml'
      - 'tools/public-proxy-smoke.ps1'
      - 'crates/adapters-proxy/examples/public_proxy_probe.rs'
permissions:
  contents: read
jobs:
  public-proxy:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build and check the actual Brows proxy adapter
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p brows-adapters-proxy --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build -p brows-adapters-proxy --example public_proxy_probe --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test six explicitly listed public proxies
        timeout-minutes: 5
        shell: pwsh
        run: |
          # Public, anonymous samples retrieved from the source on 2026-11-07.
          # They are temporary diagnostics, never application defaults.
          @'
          [
            {"scheme":"http","host":"192.169.179.201","port":7890},
            {"scheme":"http","host":"38.127.172.219","port":37234},
            {"scheme":"http","host":"147.93.176.66","port":3128},
            {"scheme":"socks5","host":"107.150.41.226","port":18080},
            {"scheme":"socks5","host":"107.181.252.58","port":1081},
            {"scheme":"socks5","host":"184.178.172.17","port":4145}
          ]
          '@ | Set-Content public-proxy-candidates.json
          ./tools/public-proxy-smoke.ps1 -Candidates public-proxy-candidates.json
      - name: Preserve public-proxy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-proxy-smoke-${{ github.sha }}
          path: target/public-proxy-smoke.json
          if-no-files-found: warn
