name: Qualify the completed pinned native build
on:
  workflow_run:
    workflows: ['Cached native Chromium runtime qualification']
    types: [completed]
    branches: [codex/native-cpp-compile-check]
permissions:
  contents: read
  actions: read
concurrency:
  group: native-candidate-followup-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  qualification:
    # Exactly one owned, immutable build. No fork refs or dynamic workflow code.
    if: >-
      format('{0}', github.event.workflow_run.id) == '44216582797' &&
      github.event.workflow_run.head_sha == '4162be59d09b0f8ec5a90f526a4e81cb51384f7b' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    uses: kvF02/brows/.github/workflows/native-candidate-runtime.yml@8e03cedcdef93927b6443c7cfcac95782ee28faf
