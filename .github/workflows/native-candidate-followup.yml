name: Qualify the completed pinned native build
on:
  workflow_run:
    workflows: ['Cached native Chromium runtime qualification']
    types: [completed]
    branches: [codex/native-cpp-compile-check]
permissions:
  contents: read
  actions: read
concurrency:
  group: native-candidate-followup-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  qualification:
    # Exactly one owned, immutable build. No fork refs or dynamic workflow code.
    if: >-
      format('{0}', github.event.workflow_run.id) == '44082221586' &&
      github.event.workflow_run.head_sha == 'ed903170d6a4d54fe3ac6d11ec98d5a467d0477b' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    uses: kvF02/brows/.github/workflows/native-candidate-runtime.yml@0ce786e3b7d1e0b00ce826bf87e4aa6f82ef8aa5
