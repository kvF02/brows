name: Qualify the completed pinned native build
on:
  pull_request:
    paths:
      - '.github/workflows/native-candidate-followup.yml'
      - 'tools/native_qualification_result.py'
      - 'tools/test_native_qualification_result.py'
  workflow_run:
    workflows: ['Cached native Chromium runtime qualification']
    types: [completed]
    branches: [codex/native-cpp-compile-check]
permissions:
  contents: read
  actions: read
concurrency:
  group: native-candidate-followup-${{ github.event.workflow_run.id || github.ref }}
  cancel-in-progress: false
jobs:
  report-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s tools -p test_native_qualification_result.py -v
      - name: Inspect logged compiler progress for the pinned source run
        uses: actions/github-script@v7
        with:
          script: |
            const run_id = 45641298599;
            const head = 'c12d8fbacf564264cccfbaca8b2bbf0522dfc7f1';
            const repo = context.repo;
            const {data: run} = await github.rest.actions.getWorkflowRun({ ...repo, run_id });
            if (run.head_sha !== head || run.workflow_id !== 421301331 ||
                run.head_repository?.full_name !== 'kvF02/brows' || run.run_attempt !== 1) {
              throw new Error('Unexpected native source run, head or attempt');
            }
            if (run.status !== 'completed') {
              core.info('The source build is still running.');
              return;
            }
            const {data} = await github.rest.actions.listJobsForWorkflowRunAttempt({
              ...repo, run_id, attempt_number: 1, per_page: 100
            });
            for (const name of ['Preserve bounded compilation work (not native qualification)',
                                'Resume compiler work and require all native runtime positives']) {
              const matches = data.jobs.filter(job => job.name === name);
              if (matches.length !== 1) throw new Error('Expected exactly one job named ' + name);
              const job = matches[0];
              if (job.conclusion === 'skipped') {
                core.info(name + ' was skipped.');
                continue;
              }
              let raw;
              try {
                ({data: raw} = await github.rest.actions.downloadJobLogsForWorkflowRun({
                  ...repo, job_id: job.id
                }));
              } catch (error) {
                if (error.status !== 404 && error.status !== 410) throw error;
                core.info(name + ': job log unavailable.');
                continue;
              }
              const log = typeof raw === 'string' ? raw : Buffer.from(raw).toString('utf8');
              let largestTotal = 0;
              let finalSample;
              // Siso updates its graph size while it runs. The final counter and
              // the largest denominator can come from different progress lines.
              for (const line of log.split(/\r?\n/)) {
                const match = line.match(/\[\s*(\d+)\s*\/\s*(\d+)\s*\]/);
                if (!match) continue;
                const done = Number(match[1]), total = Number(match[2]);
                if (done > total) continue;
                largestTotal = Math.max(largestTotal, total);
                finalSample = { done, total, at: line.match(/^\d{4}-\d{2}-\d{2}T[\d:.]+Z/)?.[0] ?? null };
              }
              const source = 'https://github.com/' + repo.owner + '/' + repo.repo +
                '/actions/runs/' + run_id + '/job/' + job.id;
              core.info(JSON.stringify({name, source, conclusion: job.conclusion,
                largestTotal, finalSample: finalSample ?? null}));
            }
  qualification:
    # Exactly one owned, immutable build. No fork refs or dynamic workflow code.
    if: >-
      format('{0}', github.event.workflow_run.id) == '45641298599' &&
      github.event.workflow_run.head_sha == 'c12d8fbacf564264cccfbaca8b2bbf0522dfc7f1' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    uses: kvF02/brows/.github/workflows/native-candidate-runtime.yml@05a44fff5b809f51778588b32a06a65990cb2e15
  combined-result:
    needs: qualification
    if: ${{ !cancelled() && needs.qualification.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SOURCE_RESULT: ${{ github.event.workflow_run.conclusion }}
      CONTROLLER_RESULT: ${{ needs.qualification.result }}
      SOURCE_ID: ${{ github.event.workflow_run.id }}
      SOURCE_HEAD: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        id: build
        continue-on-error: ${{ env.SOURCE_RESULT != 'success' }}
        with:
          name: native-build-evidence
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: evidence/source
      - uses: actions/download-artifact@v4
        if: env.SOURCE_RESULT != 'success' && steps.build.outcome == 'failure'
        continue-on-error: true
        with:
          name: native-compile-checkpoint-evidence
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: evidence/checkpoint
      - uses: actions/download-artifact@v4
        if: env.SOURCE_RESULT == 'success' && env.CONTROLLER_RESULT == 'success'
        with:
          name: native-candidate-controller-qualification
          path: evidence/controller
      - name: Bind upstream and controller results to the same candidate
        if: ${{ !cancelled() }}
        run: python tools/native_qualification_result.py
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: combined-native-qualification
          path: evidence/combined-result.json
          if-no-files-found: error
