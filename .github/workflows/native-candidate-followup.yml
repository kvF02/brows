name: Qualify the completed pinned native build
on:
  workflow_run:
    workflows: ['Cached native Chromium runtime qualification']
    types: [completed]
    branches: [codex/native-cpp-compile-check]
permissions:
  contents: read
  actions: read
concurrency:
  group: native-candidate-followup-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  qualification:
    # Exactly one owned, immutable build. No fork refs or dynamic workflow code.
    if: >-
      format('{0}', github.event.workflow_run.id) == '44462941292' &&
      github.event.workflow_run.head_sha == '61df21b58ff465556d02d4260f1db35625a6f948' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    uses: kvF02/brows/.github/workflows/native-candidate-runtime.yml@a2bb447d8cb3e5d3ade3f1ada6924d7dca68dd57
