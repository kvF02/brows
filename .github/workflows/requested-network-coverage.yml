name: Requested extended browser network acceptance
on:
  push:
    branches: [codex/run-network-coverage]
    paths: ['.github/workflows/requested-network-coverage.yml']
permissions:
  contents: read
concurrency:
  group: live-browser-network-${{ github.ref }}
  cancel-in-progress: true
jobs:
  live:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d2370f238dc2912408b81c8a496b932aa42ea8e3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate the bounded test page
        run: node --test tools/live-network-page.test.mjs
      - name: Build the embedded UI
        run: |
          npm ci --prefix ui
          npm run ui:build
      - name: Select signed Edge
        shell: pwsh
        run: |
          $edge = Join-Path ${env:ProgramFiles(x86)} 'Microsoft/Edge/Application/msedge.exe'
          $signature = Get-AuthenticodeSignature -LiteralPath $edge
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false) -ne 'Microsoft Corporation') { throw 'Edge signature admission failed' }
          "BROWS_ACCEPTANCE_BROWSER=$edge" >> $env:GITHUB_ENV
          $version = [Diagnostics.FileVersionInfo]::GetVersionInfo($edge)
          "BROWS_ACCEPTANCE_VERSION=$($version.ProductMajorPart).$($version.ProductMinorPart).$($version.ProductBuildPart).$($version.ProductPrivatePart)" >> $env:GITHUB_ENV
          "BROWS_PRODUCT_COMMIT=$(git rev-parse HEAD)" >> $env:GITHUB_ENV
      - run: rustup toolchain install 1.97.1 --profile minimal
      - uses: actions/cache/restore@v4
        with:
          path: target/debug
          key: windows-rust-v2-1.97.1-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - name: Compile without credentials
        shell: pwsh
        run: |
          $messages = @(cargo +1.97.1 test -p brows-desktop --lib --locked --no-run --message-format=json | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) {
            $messages | Where-Object reason -eq 'compiler-message' | ForEach-Object { $_.message.rendered }
            throw 'Live network test build failed'
          }
          $binaries = @($messages | Where-Object {
            $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'brows_desktop' -and $_.executable
          } | ForEach-Object executable)
          if ($binaries.Count -ne 1) { throw 'Expected one desktop test executable' }
          "BROWS_LIVE_TEST_EXE=$($binaries[0])" >> $env:GITHUB_ENV
      - name: Exercise saved proxies, actual browsers and application reopen
        timeout-minutes: 12
        shell: pwsh
        env:
          BROWS_PROXY_ENDPOINTS: 82.22.73.227:7433,64.52.28.63:7750
          BROWS_PROXY_ACCEPTANCE_USERNAME: ${{ secrets.BROWS_PROXY_ACCEPTANCE_USERNAME }}
          BROWS_PROXY_ACCEPTANCE_PASSWORD: ${{ secrets.BROWS_PROXY_ACCEPTANCE_PASSWORD }}
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Disposable runner required' }
          Push-Location crates/desktop
          try {
            & $env:BROWS_LIVE_TEST_EXE live_browser_network_acceptance --ignored --nocapture
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
      - name: Recompute scoped conclusions from raw observations
        if: always()
        shell: pwsh
        run: |
          if (Test-Path target/live-browser-network-acceptance.json) {
            node tools/analyze-live-network.mjs target/live-browser-network-acceptance.json target/live-network-analysis.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-browser-network-acceptance-${{ github.run_id }}
          path: |
            target/live-browser-network-acceptance.json
            target/live-network-analysis.json
          if-no-files-found: warn
          retention-days: 7
