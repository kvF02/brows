name: Windows soak and recovery
on:
  workflow_dispatch:
    inputs:
      persona:
        description: Browser persona
        type: choice
        options: [SystemNative, SeedableNoise]
        default: SystemNative
      minutes:
        description: Steady ten-profile load in minutes
        type: choice
        options: ['1', '30', '120', '240']
        default: '120'
  pull_request:
    types: [opened, reopened, synchronize, edited]
    paths:
      - '.github/workflows/windows-soak.yml'
      - 'crates/adapters-runtime/src/**'
      - 'crates/desktop/src/state.rs'
      - 'crates/desktop/src/state/tests/soak.rs'
      - 'crates/desktop/src/state/tests/soak/**'
      - 'tools/windows-soak.ps1'
      - 'tools/test_support/controlled_browser.rs'
      - 'tools/test_support/first_observation.js'
      - 'tools/test_support/seeded_soak_page.js'
      - 'tools/test_support/soak_page.html'
permissions:
  contents: read
jobs:
  soak:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'edited' ||
      (github.event.changes.title != null &&
      (startsWith(github.event.pull_request.title, '[soak-2h] ') ||
      startsWith(github.event.pull_request.title, '[seeded-soak-30m] ')))))
    strategy:
      fail-fast: false
      matrix:
        persona: ${{ fromJSON(inputs.persona == 'SystemNative' && '["SystemNative"]' || inputs.persona == 'SeedableNoise' && '["SeedableNoise"]' || '["SystemNative","SeedableNoise"]') }}
    concurrency:
      group: windows-soak-${{ github.ref }}-${{ matrix.persona }}
      cancel-in-progress: true
    runs-on: windows-latest
    timeout-minutes: 270
    env:
      BROWS_SOAK_PERSONA: ${{ matrix.persona }}
      BROWS_SOAK_MINUTES: >-
        ${{ inputs.minutes ||
        (matrix.persona == 'SystemNative' && startsWith(github.event.pull_request.title, '[soak-2h] ') && '120') ||
        (matrix.persona == 'SeedableNoise' && startsWith(github.event.pull_request.title, '[seeded-soak-30m] ') && '30') || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the embedded UI
        run: |
          npm ci --prefix ui
          npm run ui:build
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - uses: actions/cache/restore@v4
        with:
          path: target/debug
          key: windows-rust-v2-1.97.1-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            windows-rust-v2-1.97.1-
      - name: Build the isolated test host
        shell: pwsh
        run: |
          $messages = @(cargo +1.97.1 test -p brows-desktop --lib --locked --no-run --message-format=json | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) {
            $messages | Where-Object reason -eq 'compiler-message' | ForEach-Object { $_.message.rendered }
            throw 'Soak test build failed'
          }
          $testBinaries = @($messages | Where-Object {
            $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'brows_desktop' -and $_.executable
          } | ForEach-Object executable)
          if ($testBinaries.Count -ne 1) { throw 'Expected one desktop test executable' }
          "BROWS_SOAK_TEST_EXE=$($testBinaries[0])" >> $env:GITHUB_ENV
      - name: Run the ten-profile acceptance
        shell: pwsh
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'The soak policy requires a disposable runner' }
          # Edge sleeps idle background tabs after 15 minutes. Keep only the
          # loopback workload eligible for continuous page heartbeats.
          $policy = 'HKCU:\Software\Policies\Microsoft\Edge\SleepingTabsBlockedForUrls'
          if (Test-Path -LiteralPath $policy) { throw 'Unexpected pre-existing Edge sleep exception policy' }
          New-Item -Path $policy -Force | Out-Null
          try {
            $env:BROWS_SOAK_LOOPBACK_POLICY = 'http://127.0.0.1'
            New-ItemProperty -LiteralPath $policy -Name '1' -Value $env:BROWS_SOAK_LOOPBACK_POLICY -PropertyType String | Out-Null
            if ($env:BROWS_SOAK_PERSONA -eq 'SeedableNoise') {
              & $env:BROWS_SOAK_TEST_EXE --ignored --exact state::tests::soak::seeded::seedable_noise_soak --nocapture
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $report = Get-Content -LiteralPath target/windows-seeded-soak-report.json -Raw | ConvertFrom-Json
              if (-not $report.assertionsPassed -or $report.observedSeconds -lt (60 * [int]$env:BROWS_SOAK_MINUTES)) {
                throw 'SeedableNoise soak report is missing passing evidence'
              }
            } else {
              ./tools/windows-soak.ps1 -TestExecutable $env:BROWS_SOAK_TEST_EXE -Seconds (60 * [int]$env:BROWS_SOAK_MINUTES) -Report target/windows-soak-report.json
            }
          } finally {
            Remove-Item -LiteralPath $policy
          }
      - name: Preserve stability and recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-soak-${{ matrix.persona }}-${{ github.sha }}-${{ env.BROWS_SOAK_MINUTES }}min
          path: |
            target/windows-soak-report.json
            target/windows-seeded-soak-report.json
          if-no-files-found: warn
