name: Development checks

on:
  push:
    branches-ignore: ["alpha/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      official_runtime:
        description: "Install official Windows Chrome for Testing and measure two temporary fingerprint profiles"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - run: cargo +1.97.1 fmt --all -- --check
      - run: cargo +1.97.1 test --locked --workspace --exclude brows-desktop
      - run: cargo +1.97.1 clippy --locked --workspace --exclude brows-desktop --all-targets -- -D warnings

  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy
      - run: npm ci --prefix ui
      - run: npm run ui:build
      - run: npm run test:fingerprint
      - run: npm run test:settings
      - run: npm run test:backups
      - run: npm run test:runtimes
      - run: npm run test:alpha
      # Real signed-Chrome probes remain explicit opt-in checks. This suite
      # includes job-object process-tree tests and recovery without Chrome.
      - run: cargo +1.97.1 test --locked --workspace
      - run: cargo +1.97.1 clippy --locked --workspace --all-targets -- -D warnings

  windows-official-runtime:
    if: github.event_name == 'workflow_dispatch' && inputs.official_runtime
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      # Explicit opt-in: contacts the fixed official catalog and Google storage,
      # installs into an isolated temporary directory, and launches headless Chrome.
      - run: cargo +1.97.1 test --locked -p brows-adapters-runtime official_windows_install_and_probe_smoke -- --ignored --nocapture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-fingerprint-measurement
          path: |
            target/runtime-acceptance.json
            target/fingerprint-measurement.json
          if-no-files-found: warn
