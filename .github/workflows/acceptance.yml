name: Windows runtime acceptance
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Unit and adapter tests
        run: npm test
      - name: UI type check and build
        run: |
          npm ci --prefix ui
          npm run ui:build
      - name: Select signed Edge runtime
        shell: pwsh
        run: |
          $edge = Join-Path ${env:ProgramFiles(x86)} 'Microsoft/Edge/Application/msedge.exe'
          $signature = Get-AuthenticodeSignature -LiteralPath $edge
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false) -ne 'Microsoft Corporation') { throw 'Edge signature admission failed' }
          "BROWS_ACCEPTANCE_BROWSER=$edge" >> $env:GITHUB_ENV
          "BROWS_ACCEPTANCE_DATA_ROOT=$(Join-Path $env:RUNNER_TEMP 'brows-acceptance')" >> $env:GITHUB_ENV
      - name: Cross-context observations
        shell: pwsh
        run: |
          node tools/fingerprint-observation.mjs $env:BROWS_ACCEPTANCE_BROWSER target/fingerprint-observation.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: Rust tests and lint
        run: |
          cargo +1.97.1 test --workspace --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.97.1 clippy --workspace --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Production registration and capability probe
        run: cargo +1.97.1 test -p brows-desktop signed_runtime_acceptance -- --ignored --nocapture
      - name: Preserve actual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fingerprint-observation-windows
          path: target/fingerprint-observation.json
          if-no-files-found: ignore
