name: Windows runtime acceptance
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install formatter
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt
      - name: Check all Rust source formatting independently
        run: |
          cargo +1.97.1 fmt --all -- --check
          rustfmt +1.97.1 --edition 2021 --check tools/test_support/controlled_browser.rs
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Unit and adapter tests
        timeout-minutes: 3
        run: npm test
      - name: UI type check and build
        run: |
          npm ci --prefix ui
          npm run ui:build
      - name: Select signed Edge runtime
        shell: pwsh
        run: |
          $edge = Join-Path ${env:ProgramFiles(x86)} 'Microsoft/Edge/Application/msedge.exe'
          $signature = Get-AuthenticodeSignature -LiteralPath $edge
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false) -ne 'Microsoft Corporation') { throw 'Edge signature admission failed' }
          "BROWS_ACCEPTANCE_BROWSER=$edge" >> $env:GITHUB_ENV
          $version = [Diagnostics.FileVersionInfo]::GetVersionInfo($edge)
          "BROWS_ACCEPTANCE_VERSION=$($version.ProductMajorPart).$($version.ProductMinorPart).$($version.ProductBuildPart).$($version.ProductPrivatePart)" >> $env:GITHUB_ENV
          "BROWS_ACCEPTANCE_DATA_ROOT=$(Join-Path $env:RUNNER_TEMP 'brows-acceptance')" >> $env:GITHUB_ENV
      - name: Cross-context observations
        shell: pwsh
        run: |
          node tools/fingerprint-observation.mjs $env:BROWS_ACCEPTANCE_BROWSER target/fingerprint-observation.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - uses: actions/cache/restore@v4
        id: rust_cache
        with:
          path: target/debug
          key: windows-rust-v2-1.97.1-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            windows-rust-v2-1.97.1-
            windows-rust-1.97.1-${{ hashFiles('Cargo.lock') }}-
            windows-rust-1.97.1-
      - name: Rust formatting check
        shell: pwsh
        run: |
          cargo +1.97.1 fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustfmt +1.97.1 --edition 2021 --check tools/test_support/controlled_browser.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Rust tests and lint
        if: ${{ !cancelled() }}
        id: rust_checks
        run: |
          cargo +1.97.1 test --workspace --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.97.1 clippy --workspace --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Production registration and capability probe
        timeout-minutes: 5
        shell: pwsh
        run: |
          foreach ($round in 1..6) {
            Write-Output "Production acceptance round $round"
            cargo +1.97.1 test -p brows-desktop signed_runtime_acceptance -- --ignored --nocapture
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Copy-Item -LiteralPath target/fingerprint-session-acceptance.json -Destination "target/fingerprint-session-acceptance-round-$round.json" -ErrorAction Stop
          }
      - name: Worker restart and rendering acceptance
        if: ${{ !cancelled() && steps.rust_checks.outcome == 'success' }}
        timeout-minutes: 5
        shell: pwsh
        run: |
          foreach ($round in 1..3) {
            Write-Output "Worker lifecycle acceptance round $round"
            cargo +1.97.1 test -p brows-adapters-runtime private_worker_lifecycle_acceptance -- --ignored --nocapture
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Module Worker first-script acceptance
        if: ${{ !cancelled() && steps.rust_checks.outcome == 'success' }}
        timeout-minutes: 3
        run: cargo +1.97.1 test -p brows-adapters-runtime private_module_worker_acceptance -- --ignored --nocapture
      - name: Renderer crash and reload acceptance
        if: ${{ !cancelled() && steps.rust_checks.outcome == 'success' }}
        timeout-minutes: 3
        shell: pwsh
        run: |
          foreach ($round in 1..3) {
            Write-Output "Renderer crash acceptance round $round"
            cargo +1.97.1 test -p brows-adapters-runtime private_renderer_crash_acceptance -- --ignored --nocapture
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Managed runtime capture and restart acceptance
        if: ${{ !cancelled() && steps.rust_checks.outcome == 'success' }}
        timeout-minutes: 7
        run: cargo +1.97.1 test -p brows-desktop managed_runtime_acceptance -- --ignored --nocapture
      - name: Ten-profile bounded capacity acceptance
        if: ${{ !cancelled() && steps.rust_checks.outcome == 'success' }}
        timeout-minutes: 4
        run: cargo +1.97.1 test -p brows-desktop desktop_capacity_acceptance -- --ignored --nocapture
      - uses: actions/cache/save@v4
        if: ${{ success() && steps.rust_cache.outputs.cache-hit != 'true' }}
        with:
          path: target/debug
          key: windows-rust-v2-1.97.1-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - name: Preserve actual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fingerprint-observation-windows
          path: |
            target/fingerprint-observation.json
            target/fingerprint-session-acceptance.json
            target/fingerprint-session-acceptance-round-*.json
            target/fingerprint-module-worker-acceptance.json
            target/fingerprint-renderer-crash-acceptance.json
            target/managed-runtime-acceptance.json
            target/desktop-capacity-acceptance.json
          if-no-files-found: ignore
