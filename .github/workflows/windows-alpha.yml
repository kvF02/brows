name: Windows Alpha test build

on:
  workflow_dispatch:
    inputs:
      official_runtime:
        description: "Also download official Chrome for Testing and run real headless fingerprint acceptance"
        required: false
        default: true
        type: boolean
  push:
    branches: ["alpha/**"]

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 4
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt
      - uses: actions/cache/restore@v4
        id: rust-cache
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/alpha-build
          key: windows-alpha-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            windows-alpha-${{ hashFiles('Cargo.lock') }}-
            windows-alpha-
      - name: Check, build and package isolated Alpha
        id: package
        shell: pwsh
        run: |
          $package = & ./tools/build-alpha.ps1
          "directory=$($package.Directory)" >> $env:GITHUB_OUTPUT
          "artifact_name=$($package.ArtifactName)" >> $env:GITHUB_OUTPUT
      - name: Source tree status after build
        if: always()
        run: git status --short
      - uses: actions/cache/save@v4
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/alpha-build
          key: windows-alpha-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        id: artifact
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.directory }}/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14
      - name: Link download and explain test scope
        shell: pwsh
        env:
          ALPHA_ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          "### Brows Alpha for Windows x64" >> $env:GITHUB_STEP_SUMMARY
          "[Download test build]($env:ALPHA_ARTIFACT_URL)" >> $env:GITHUB_STEP_SUMMARY
          "The archive contains the executable, Chinese test notes, source revision and SHA-256 checksums. Alpha uses its own data namespace." >> $env:GITHUB_STEP_SUMMARY
          "This package does not certify real fingerprint support. Check the separate fingerprint job and the runtime probe on the test PC." >> $env:GITHUB_STEP_SUMMARY

  native-browser:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc
      - uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/alpha-build
          key: windows-alpha-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            windows-alpha-${{ hashFiles('Cargo.lock') }}-
            windows-alpha-
      - name: Build embedded frontend assets for native test harness
        shell: pwsh
        run: |
          npm.cmd ci --prefix ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run ui:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real signed Chrome isolation, queue and restart acceptance
        shell: pwsh
        run: |
          $env:TAURI_CONFIG = Get-Content ./crates/desktop/tauri.alpha.conf.json -Raw
          $env:CARGO_TARGET_DIR = Join-Path $env:GITHUB_WORKSPACE 'target/alpha-build'
          cargo +1.97.1 test --locked -p brows-desktop --target x86_64-pc-windows-msvc system_native_windows_acceptance -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-browser-acceptance
          path: target/native-browser-acceptance.json
          if-no-files-found: warn
          retention-days: 14
      - name: Observe system Chrome fingerprint capability without assuming support
        if: always() && !cancelled()
        shell: pwsh
        run: |
          $env:TAURI_CONFIG = Get-Content ./crates/desktop/tauri.alpha.conf.json -Raw
          $env:CARGO_TARGET_DIR = Join-Path $env:GITHUB_WORKSPACE 'target/alpha-build'
          cargo +1.97.1 test --locked -p brows-desktop --target x86_64-pc-windows-msvc fingerprint_runtime_real_probe_smoke_test -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-system-chrome-fingerprint-probe
          path: target/system-chrome-fingerprint-probe.json
          if-no-files-found: warn
          retention-days: 14

  startup:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: target/downloaded-alpha
      - name: Ensure the documented WebView2 runtime prerequisite
        shell: pwsh
        run: |
          $roots = @("${env:ProgramFiles(x86)}/Microsoft/EdgeWebView/Application", "$env:LOCALAPPDATA/Microsoft/EdgeWebView/Application")
          $installed = $false
          foreach ($root in $roots) {
            if (Test-Path -LiteralPath $root) {
              foreach ($version in Get-ChildItem -LiteralPath $root -Directory) {
                if (Test-Path -LiteralPath (Join-Path $version.FullName 'msedgewebview2.exe')) { $installed = $true }
              }
            }
          }
          if (-not $installed) {
            $installer = Join-Path $env:RUNNER_TEMP 'BrowsAlpha-WebView2Setup.exe'
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
            $signature = Get-AuthenticodeSignature -LiteralPath $installer
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.GetNameInfo('SimpleName', $false) -ne 'Microsoft Corporation') { throw 'WebView2 installer signature was not verified.' }
            $process = Start-Process -FilePath $installer -ArgumentList '/silent', '/install' -Wait -PassThru
            if ($process.ExitCode -notin @(0, 3010)) { throw "WebView2 installation failed: $($process.ExitCode)" }
          }
      - name: Launch packaged Alpha and close its main window
        shell: pwsh
        run: ./tools/smoke-alpha.ps1 -Executable ./target/downloaded-alpha/Brows-Alpha.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-alpha-startup-report
          path: target/alpha-startup/
          if-no-files-found: warn
          retention-days: 14

  fingerprint:
    if: github.event_name == 'push' || inputs.official_runtime
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Real official CFT installation and two-profile observation
        run: cargo +1.97.1 test --locked -p brows-adapters-runtime official_windows_install_and_probe_smoke -- --ignored --nocapture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-alpha-fingerprint-report
          path: |
            target/runtime-acceptance.json
            target/fingerprint-measurement.json
          if-no-files-found: warn
          retention-days: 14
