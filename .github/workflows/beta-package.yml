name: Windows beta package
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: beta-package-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate client collector with Windows PowerShell 5.1
        shell: powershell
        run: ./tools/test-client-acceptance.ps1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - uses: actions/cache/restore@v4
        id: release_cache
        with:
          path: target/release
          key: windows-beta-v2-1.97.1-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            windows-beta-v2-1.97.1-
            windows-beta-1.97.1-${{ hashFiles('Cargo.lock') }}-
            windows-beta-1.97.1-
      - name: Install UI dependencies
        run: npm ci --prefix ui
      - name: Build packaged application and NSIS installer
        id: package_build
        run: npm run desktop:package
      - name: Install, open, upgrade and uninstall the actual package
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $installer) { throw 'No NSIS installer produced' }
          ./tools/windows-beta-smoke.ps1 -Installer $installer.FullName -Report target/beta-package-acceptance.json
      - name: Record hashes and unsigned beta status
        shell: pwsh
        run: |
          $files = @(Get-Item target/release/brows-desktop.exe) + @(Get-ChildItem target/release/bundle/nsis/*-setup.exe)
          $hashes = @($files | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" })
          $acceptance = Get-Content target/beta-package-acceptance.json -Raw | ConvertFrom-Json
          if (-not $acceptance.assertionsPassed -or $acceptance.installedApplicationSha256 -notmatch '^[a-f0-9]{64}$') { throw 'Missing installed application hash' }
          $hashes += "$($acceptance.installedApplicationSha256)  installed/brows-desktop.exe"
          $hashes | Set-Content target/SHA256SUMS.txt
          $signature = Get-AuthenticodeSignature target/release/brows-desktop.exe
          @{ commit = '${{ github.sha }}'; channel = 'internal-beta'; authenticode = "$($signature.Status)"; autoUpdate = $false } | ConvertTo-Json | Set-Content target/beta-build.json
      - name: Assemble verified client acceptance kit
        shell: pwsh
        run: ./tools/package-client-acceptance.ps1 -ArtifactRoot target -Destination target/brows-windows-client-kit.zip
      - uses: actions/upload-artifact@v4
        with:
          name: brows-windows-client-kit-${{ github.sha }}
          path: target/brows-windows-client-kit.zip
          if-no-files-found: error
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.package_build.outcome == 'success' && steps.release_cache.outputs.cache-hit != 'true' }}
        with:
          path: target/release
          key: windows-beta-v2-1.97.1-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brows-windows-beta-${{ github.sha }}
          path: |
            target/release/brows-desktop.exe
            target/release/bundle/nsis/*-setup.exe
            target/SHA256SUMS.txt
            target/beta-build.json
            target/beta-package-acceptance.json
          if-no-files-found: warn
  windows11-arm:
    needs: package
    # A desktop client OS, running the same x64 package under emulation.
    # Keep this evidence separate from x64 hardware and the Server UI job.
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: brows-windows-client-kit-${{ github.sha }}
          path: target/download
      - name: Extract the client kit
        shell: pwsh
        run: Expand-Archive -LiteralPath target/download/brows-windows-client-kit.zip -DestinationPath target/client-kit
      - name: Install, open, upgrade and uninstall the x64 package on Windows 11 ARM64
        shell: pwsh
        run: ./tools/windows-client-smoke.ps1 -KitDirectory target/client-kit -Report target/windows11-arm-acceptance.json
      - name: Preserve client OS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brows-windows11-arm-${{ github.sha }}
          path: |
            target/windows11-arm-acceptance.json
            target/windows11-arm-acceptance.json.package.json
          if-no-files-found: warn
  ui:
    needs: package
    # The current Windows 2025 image cannot create a WebView2 WebDriver
    # session (DevToolsActivePort). Drive the same packaged binary here;
    # installer and production browser acceptance remain on windows-latest.
    runs-on: windows-2022
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: brows-windows-beta-${{ github.sha }}
          path: target
      - name: Install the exact packaged build on the UI runner
        shell: pwsh
        run: |
          $hashes = Get-Content target/SHA256SUMS.txt
          $line = @($hashes | Where-Object { $_.EndsWith('  installed/brows-desktop.exe', [StringComparison]::Ordinal) })
          if ($line.Count -ne 1) { throw 'Missing installed application hash' }
          $expected = ($line[0] -split ' ')[0]
          $installers = @(Get-ChildItem target/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected one NSIS installer' }
          $installer = $installers[0]
          $installerLine = @($hashes | Where-Object { $_.EndsWith("  $($installer.Name)", [StringComparison]::Ordinal) })
          if ($installerLine.Count -ne 1 -or (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash -ine ($installerLine[0] -split ' ')[0]) {
            throw 'Installer artifact hash mismatch'
          }
          $installRoot = Join-Path $env:GITHUB_WORKSPACE 'target/installed'
          $setup = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installRoot") -PassThru
          if (-not $setup.WaitForExit(120000)) { $setup.Kill(); throw 'UI fixture installation timed out' }
          if ($setup.ExitCode -ne 0) { throw "UI fixture installer exited $($setup.ExitCode)" }
          $app = Join-Path $installRoot 'brows-desktop.exe'
          if ((Get-FileHash -LiteralPath $app -Algorithm SHA256).Hash -ine $expected) { throw 'Installed application hash mismatch' }
      - name: Operate the packaged WebView2 interface
        timeout-minutes: 9
        shell: pwsh
        run: ./tools/windows-ui-acceptance.ps1 -Application target/installed/brows-desktop.exe -Report target/packaged-ui-acceptance.json
      - name: Preserve actual UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brows-packaged-ui-${{ github.sha }}
          path: |
            target/packaged-ui-acceptance.json
            target/packaged-ui-acceptance.png
            target/packaged-ui-acceptance-batch.png
          if-no-files-found: warn
