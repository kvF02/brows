name: Native Chromium source and build prerequisites
on:
  pull_request:
    paths:
      - 'native/chromium/**'
      - '.github/workflows/native-engine.yml'
  push:
    branches: [master]
    paths:
      - 'native/chromium/**'
      - '.github/workflows/native-engine.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-engine-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: Pinned patch and upstream generator (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        if: runner.os == 'Windows'
        with:
          node-version: 24
      - run: python -m pip install -r native/chromium/requirements.txt
      - run: python native/chromium/verify_patch.py --report target/native-source-check.json
      - run: python native/chromium/screen/verify_patch.py --report target/native-screen-source-check.json
      - run: python -m unittest discover -s native/chromium -p test_stage_runtime.py -v
      - name: Parse Windows build drivers before any large checkout
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem native/chromium/*.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
          . ./native/chromium/windows-tools.ps1
          $resolved = Resolve-NativeBuildTools
          Write-Output "$($resolved.pythonVersion) / $($resolved.nodeVersion)"
      - name: Verify pinned depot_tools Python bootstrap without Chromium checkout
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./native/chromium/test-depot-bootstrap.ps1 -Report target/native-depot-bootstrap.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-source-check-${{ matrix.os }}
          path: |
            target/native-source-check.json
            target/native-screen-source-check.json
            target/native-depot-bootstrap.json
          if-no-files-found: warn
  windows-preflight:
    name: Windows build prerequisites only
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.preflight.outputs.ready }}
      can_prepare_sdk: ${{ steps.preflight.outputs.can_prepare_sdk }}
      drive: ${{ steps.preflight.outputs.drive }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect build host without changing it
        id: preflight
        shell: pwsh
        run: ./native/chromium/windows-preflight.ps1 -Report target/native-windows-preflight.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-windows-preflight
          path: target/native-windows-preflight.json
          if-no-files-found: warn
  build:
    name: Native Chromium build and runtime proof
    needs: [source, windows-preflight, stock-control]
    if: >-
      (needs.windows-preflight.outputs.ready == 'true' || needs.windows-preflight.outputs.can_prepare_sdk == 'true') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: python -m pip install -r native/chromium/requirements.txt
      - name: Prepare pinned SDK on this disposable build host
        shell: pwsh
        run: ./native/chromium/prepare-hosted-windows.ps1 -Report target/native-build.json.sdk.json
      - name: Build only after this host passes its own preflight
        id: native-build
        shell: pwsh
        env:
          BUILD_DRIVE: ${{ needs.windows-preflight.outputs.drive }}
        run: |
          if ($env:BUILD_DRIVE -notmatch '^[A-Z]:$') { throw 'Invalid build drive' }
          ./native/chromium/build-windows.ps1 -BuildRoot "$($env:BUILD_DRIVE)\brows-native-source" -Report target/native-build.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-build-evidence
          path: target/native-build.json*
          if-no-files-found: warn
      - name: Preserve the isolated test distribution for follow-up acceptance
        uses: actions/upload-artifact@v4
        if: always() && steps.native-build.outputs.test_runtime_ready == 'true'
        with:
          name: experimental-headless-test-runtime
          path: ${{ steps.native-build.outputs.test_runtime_directory }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 1
  stock-control:
    name: Signed Edge native getter and lifecycle controls
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Observe stock native Worker platform
        shell: pwsh
        run: |
          $edge = Join-Path ${env:ProgramFiles(x86)} 'Microsoft/Edge/Application/msedge.exe'
          $signature = Get-AuthenticodeSignature -LiteralPath $edge
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false) -ne 'Microsoft Corporation') { throw 'Edge signature admission failed' }
          $digest = (Get-FileHash -LiteralPath $edge -Algorithm SHA256).Hash.ToLowerInvariant()
          node native/chromium/platform-acceptance.mjs --browser $edge --sha256 $digest --expect stock --report target/native-stock-control.json
          if ($LASTEXITCODE -ne 0) { throw 'Stock native control failed' }
          node tools/native-worker-lifecycle.mjs --browser $edge --sha256 $digest --expect stock --report target/native-stock-lifecycle.json
          if ($LASTEXITCODE -ne 0) { throw 'Stock native lifecycle control failed' }
          node tools/native-screen-acceptance.mjs --browser $edge --sha256 $digest --expect stock --report target/native-stock-screen.json
          if ($LASTEXITCODE -ne 0) { throw 'Stock screen propagation control failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-stock-control
          path: |
            target/native-stock-control.json
            target/native-stock-lifecycle.json
            target/native-stock-screen.json
          if-no-files-found: warn
