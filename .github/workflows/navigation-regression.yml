name: Windows navigation lifecycle regression
on:
  pull_request:
    paths:
      - '.github/workflows/navigation-regression.yml'
      - 'crates/adapters-runtime/src/**'
      - 'crates/application/src/**'
      - 'tools/test_support/controlled_browser.rs'
      - 'tools/test_support/first_observation.js'
      - 'tools/test_support/webgl_observation.js'
      - 'tools/test_support/fixture_page.js'
  push:
    branches: [master]
    paths:
      - '.github/workflows/navigation-regression.yml'
      - 'crates/adapters-runtime/src/**'
      - 'crates/application/src/**'
      - 'tools/test_support/controlled_browser.rs'
      - 'tools/test_support/first_observation.js'
      - 'tools/test_support/webgl_observation.js'
      - 'tools/test_support/fixture_page.js'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: navigation-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-screen:
    name: Native screen on Windows Server 2022
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Select signature-admitted Edge
        shell: pwsh
        run: |
          $edge = Join-Path ${env:ProgramFiles(x86)} 'Microsoft/Edge/Application/msedge.exe'
          $signature = Get-AuthenticodeSignature -LiteralPath $edge
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false) -ne 'Microsoft Corporation') { throw 'Edge signature admission failed' }
          "BROWS_ACCEPTANCE_BROWSER=$edge" >> $env:GITHUB_ENV
          $v = [Diagnostics.FileVersionInfo]::GetVersionInfo($edge)
          "BROWS_ACCEPTANCE_VERSION=$($v.ProductMajorPart).$($v.ProductMinorPart).$($v.ProductBuildPart).$($v.ProductPrivatePart)" >> $env:GITHUB_ENV
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy
      - name: Verify native screen getters and CSS while preserving viewport and DPR
        timeout-minutes: 5
        run: cargo +1.97.1 test -p brows-adapters-runtime private_native_screen_acceptance --locked -- --ignored --nocapture
      - name: Lint Windows runtime paths
        run: cargo +1.97.1 clippy -p brows-adapters-runtime --all-targets --locked -- -D warnings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-screen-windows2022-evidence
          path: target/fingerprint-native-screen-acceptance.json
          if-no-files-found: warn
  lifecycle:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select signature-admitted Edge
        shell: pwsh
        run: |
          $edge = Join-Path ${env:ProgramFiles(x86)} 'Microsoft/Edge/Application/msedge.exe'
          $signature = Get-AuthenticodeSignature -LiteralPath $edge
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false) -ne 'Microsoft Corporation') { throw 'Edge signature admission failed' }
          "BROWS_ACCEPTANCE_BROWSER=$edge" >> $env:GITHUB_ENV
          $v = [Diagnostics.FileVersionInfo]::GetVersionInfo($edge)
          "BROWS_ACCEPTANCE_VERSION=$($v.ProductMajorPart).$($v.ProductMinorPart).$($v.ProductBuildPart).$($v.ProductPrivatePart)" >> $env:GITHUB_ENV
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - uses: actions/cache/restore@v4
        with:
          path: target/debug
          key: windows-rust-v2-1.97.1-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            windows-rust-v2-1.97.1-
      - name: Verify native Navigator getters and real touch input
        timeout-minutes: 3
        run: cargo +1.97.1 test -p brows-adapters-runtime private_native_navigator_acceptance --locked -- --ignored --nocapture
      - name: Verify native screen getters and CSS while preserving viewport and DPR
        timeout-minutes: 3
        run: cargo +1.97.1 test -p brows-adapters-runtime private_native_screen_acceptance --locked -- --ignored --nocapture
      - name: Verify native, seeded, reopened and different-seed GPU pixel paths
        timeout-minutes: 3
        run: cargo +1.97.1 test -p brows-adapters-runtime private_webgl_pixel_acceptance --locked -- --ignored --nocapture
      - name: Stress fresh browser navigation without retries
        timeout-minutes: 5
        run: cargo +1.97.1 test -p brows-adapters-runtime private_startup_navigation_stress_acceptance --locked -- --ignored --nocapture
      - name: Repeat real first-navigation and lifecycle checks without retries
        timeout-minutes: 10
        shell: pwsh
        run: |
          foreach ($round in 1..6) {
            foreach ($test in @('private_pending_navigation_acceptance', 'private_worker_lifecycle_acceptance', 'private_renderer_crash_acceptance', 'private_module_worker_acceptance')) {
              Write-Output "Lifecycle regression round $round / $test"
              cargo +1.97.1 test -p brows-adapters-runtime $test --locked -- --ignored --nocapture
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
      - name: Keep document network errors separate from session-control failure
        timeout-minutes: 1
        run: cargo +1.97.1 test -p brows-adapters-runtime private_navigation_error_result_acceptance --locked -- --ignored --nocapture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-lifecycle-evidence
          path: |
            target/fingerprint-pending-navigation-acceptance.json
            target/fingerprint-native-navigator-acceptance.json
            target/fingerprint-native-screen-acceptance.json
            target/fingerprint-startup-navigation-stress-acceptance.json
            target/fingerprint-webgl-pixels-acceptance.json
            target/fingerprint-worker-lifecycle-acceptance.json
            target/fingerprint-renderer-crash-acceptance.json
            target/fingerprint-module-worker-acceptance.json
          if-no-files-found: ignore
