<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1020" />
    <!--
      Production policy is intentionally self-contained.  The two loopback
      entries are only for the Vite development server and are removed by the
      Tauri packaging step (see README.md).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' ipc: http://ipc.localhost http://127.0.0.1:4173 ws://127.0.0.1:4173; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"
    />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Brows · 隔离浏览器环境</title>
  </head>
  <body>
    <noscript>Brows 管理器需要启用 JavaScript。</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
